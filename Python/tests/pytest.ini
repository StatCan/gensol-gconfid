[pytest]
markers =
    m_auto_pass: tests which should always pass and run quickly (ideal for automated tests)
    m_known_to_fail: tests to skip
    m_needs_update: test case that needs to be updated
    m_fails_missing_vs_blank: tests that fail becasue control uses missing (<NA>) while test uses blank ('')
    m_internal_build_only: tests that are only expected or able to pass on the internal build
    m_external_build_only: tests that are only expected or able to pass on the external build